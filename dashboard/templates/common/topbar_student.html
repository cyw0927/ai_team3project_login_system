<nav class="navbar default-layout-navbar col-lg-12 col-12 p-0 fixed-top d-flex flex-row ax-clean-navbar">
  <div class="navbar-brand-wrapper d-flex align-items-center">
    <a class="ax-navbar-brand" href="{% url 'student_home' %}">
      <span class="ax-navbar-logo">AX</span>
      <span class="ax-navbar-product">평가 시스템</span>
    </a>
  </div>

  <div class="navbar-menu-wrapper d-flex align-items-center">
    <button class="ax-navbar-icon-btn ax-student-sidebar-toggle d-none d-lg-inline-flex"
            type="button"
            aria-label="사이드바 접기">
      <i class="bi bi-list"></i>
    </button>

    <div class="ax-navbar-context d-none d-md-flex">
      <strong>수강생</strong>
      <span>팀 · 과제 · 평가 · 결과 확인</span>
    </div>

    <div class="ax-navbar-spacer"></div>

    <a class="ax-navbar-icon-btn position-relative"
       href="{% url 'student_notifications' %}"
       aria-label="공지·알림"
       title="공지·알림">
      <i class="bi bi-bell"></i>
      {% if notification_badge_count %}
        <span class="ax-navbar-dot"></span>
      {% endif %}
    </a>

    <div class="dropdown">
      <button class="ax-user-menu"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false">
        <span class="ax-user-avatar{% if student_has_mvp_badge %} has-mvp{% endif %}"><i class="bi bi-person"></i>{% if student_has_mvp_badge %}<span class="ax-avatar-crown" title="현재 회차 MVP"><i class="bi bi-star-fill"></i></span>{% endif %}</span>
        <span class="ax-user-copy d-none d-md-flex">
          <strong>
            {% if request.user.is_authenticated %}
              {{ request.user.get_full_name|default:request.user.username }}
            {% else %}
              수강생
            {% endif %}
          </strong>
          <small>{% if student_has_mvp_badge %}<span class="ax-topbar-mvp"><i class="bi bi-trophy-fill"></i> MVP</span>{% else %}Student{% endif %}</small>
        </span>
        <i class="bi bi-chevron-down ax-user-chevron d-none d-md-inline-block"></i>
      </button>

      <div class="dropdown-menu dropdown-menu-end ax-user-dropdown">
        <div class="ax-dropdown-head">
          <strong>
            {% if request.user.is_authenticated %}
              {{ request.user.get_full_name|default:request.user.username }}
            {% else %}
              수강생
            {% endif %}
          </strong>
          <span>수강생 계정</span>
        </div>

        <div class="dropdown-divider"></div>

        <a class="dropdown-item" href="{% url 'student_profile' %}">
          <i class="bi bi-person-circle"></i>
          마이페이지
        </a>
        <a class="dropdown-item" href="{% url 'student_notifications' %}">
          <i class="bi bi-bell"></i>
          공지·알림
        </a>

        <div class="dropdown-divider"></div>

        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="dropdown-item text-danger" type="submit">
            <i class="bi bi-box-arrow-right"></i>
            로그아웃
          </button>
        </form>
      </div>
    </div>

    <button class="ax-navbar-icon-btn ax-student-mobile-toggle d-lg-none"
            type="button"
            aria-label="메뉴 열기">
      <i class="bi bi-list"></i>
    </button>
  </div>
</nav>
